<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f3f6">
<title>무매출 · 미출고 모니터링</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f1f3f6; --bg2:#ffffff; --card:#ffffff; --card2:#f5f7fa;
  --line:#dfe3e8; --txt:#111827; --dim:#4b5563; --dim2:#6b7280;
  --teal:#0d9488; --pink:#dc2626; --yellow:#2563eb; --purple:#7c3aed;
  --red:#dc2626; --green:#059669; --blue:#1d4ed8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:linear-gradient(180deg,#f4f6f9 0%,#eef1f5 100%);
  background-attachment:fixed; color:var(--txt);
  font-family:'Pretendard','Malgun Gothic',-apple-system,sans-serif;
  padding:16px 12px 60px; line-height:1.55; font-size:15px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1280px;margin:0 auto}

/* 헤더 */
header{margin-bottom:20px}
.eyebrow{font-size:11px;letter-spacing:3px;color:var(--dim2);text-transform:uppercase}
h1{font-size:28px;font-weight:800;margin:4px 0 6px;letter-spacing:-.5px}
.sub{font-size:15px;color:var(--dim)}
.sub b{color:var(--teal)}

/* 탭 */
.tabs{display:flex;gap:6px;margin:18px 0 16px;overflow-x:auto;padding-bottom:4px;
      scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:10px 18px;border-radius:22px;background:var(--card);border:1px solid var(--line);
  color:var(--dim);font-size:15px;cursor:pointer;white-space:nowrap;font-weight:600;
  transition:.15s;box-shadow:0 1px 3px rgba(16,24,40,.06);
}
.tab:hover{color:var(--txt);border-color:var(--dim2)}
.tab.on{background:linear-gradient(160deg,#14b8a6,#0d9488);color:#fff;border-color:#0d9488;
        box-shadow:0 4px 12px rgba(13,148,136,.32)}

/* KPI 카드 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.kpi{position:relative;border-radius:16px;padding:20px 18px 18px 22px;overflow:hidden;
     border:1px solid var(--line);
     box-shadow:0 6px 18px rgba(16,24,40,.16), 0 2px 4px rgba(16,24,40,.10);
     transition:transform .16s, box-shadow .16s}
.kpi:hover{transform:translateY(-4px);
     box-shadow:0 16px 32px rgba(16,24,40,.24), 0 3px 8px rgba(16,24,40,.14)}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px}
/* 컬러 채운 KPI 카드 — 흰 글씨 */
.kpi.k-total{background:linear-gradient(145deg,#5b6b80 0%,#2f3d4f 100%);border-color:#2f3d4f}
.kpi.k-nosales{background:linear-gradient(145deg,#e8483f 0%,#a51d18 100%);border-color:#a51d18}
.kpi.k-undeliv{background:linear-gradient(145deg,#3576e8 0%,#17439f 100%);border-color:#17439f}
.kpi.k-branch{background:linear-gradient(145deg,#8250e6 0%,#5a1fb0 100%);border-color:#5a1fb0}
.kpi.k-total::before,.kpi.k-nosales::before,
.kpi.k-undeliv::before,.kpi.k-branch::before{background:rgba(255,255,255,.55)}

/* 카드 안 글씨는 전부 흰색 계열로 강제 */
.kpi .lb{color:rgba(255,255,255,.90) !important;font-weight:700}
.kpi .v{color:#ffffff !important;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.kpi .s{color:rgba(255,255,255,.94) !important}
.kpi .d,
.kpi .d.up,.kpi .d.down,.kpi .d.flat{
  color:#ffffff !important;
  display:inline-block;background:rgba(255,255,255,.24);
  padding:4px 12px;border-radius:12px;margin-top:9px;font-weight:700}

/* 카드 광택 */
.kpi::after{content:'';position:absolute;top:-40%;right:-18%;
        width:190px;height:190px;border-radius:50%;
        background:radial-gradient(circle,rgba(255,255,255,.20) 0%,transparent 70%);
        pointer-events:none}
.kpi .lb{font-size:11.5px;color:var(--dim2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.kpi .v{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.kpi .s{font-size:13px;color:var(--dim);margin-top:6px}
.kpi .d{font-size:14px;font-weight:700;margin-top:4px}
.up{color:var(--red)} .down{color:var(--green)} .flat{color:var(--dim2)}
.c-teal{color:var(--teal)} .c-pink{color:var(--pink)} .c-yellow{color:var(--yellow)}
.c-purple{color:var(--purple)} .c-blue{color:var(--blue)}

/* 카드 */
.card{background:linear-gradient(180deg,#ffffff 0%,#fcfdfe 100%);
      border:1px solid var(--line);border-radius:16px;
      padding:20px;margin-bottom:16px;
      box-shadow:0 4px 14px rgba(16,24,40,.07), 0 1px 3px rgba(16,24,40,.05)}
.card h2{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;
         align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .bar{width:4px;height:18px;border-radius:3px;
         background:linear-gradient(180deg,#14b8a6,#0d9488)}
.card h2 .note{font-size:12.5px;color:var(--dim2);font-weight:400;margin-left:auto}

/* 차트 */
.chart{width:100%;height:260px;position:relative}
.chart svg{width:100%;height:100%;overflow:visible}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--dim)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;
          vertical-align:middle}

/* 표 */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:520px}
th{background:#eef1f5;color:#374151;font-weight:700;font-size:13px;
   letter-spacing:.5px;text-align:right;padding:11px 12px;position:sticky;top:0;
   border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,th.l{text-align:left}
td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--line);
   white-space:nowrap}
td:first-child,td.l{text-align:left}
tbody tr:nth-child(even){background:#fafbfc}
tbody tr:hover{background:rgba(13,148,136,.10)}
.num{font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:3px 10px;border-radius:11px;font-size:12px;font-weight:700}
.b-fix{background:rgba(29,78,216,.10);color:var(--blue)}
.b-kids{background:rgba(124,58,237,.10);color:var(--purple)}
.b-etc{background:rgba(107,114,128,.12);color:var(--dim)}

/* 검색 */
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters input,.filters select{
  background:var(--bg2);border:1px solid var(--line);border-radius:8px;
  padding:10px 14px;color:var(--txt);font-size:14px;font-family:inherit;
}
.filters input{flex:1;min-width:180px}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--teal)}

/* 미니바 */
.mb{display:inline-block;height:7px;border-radius:3px;background:var(--teal);
    vertical-align:middle;margin-right:6px;min-width:2px}

.pane{display:none} .pane.on{display:block}
footer{text-align:center;color:var(--dim2);font-size:12.5px;margin-top:26px;
       padding-top:14px;border-top:1px solid var(--line)}
.empty{text-align:center;color:var(--dim2);padding:34px;font-size:15px}
@media(max-width:600px){
  h1{font-size:23px} .kpi .v{font-size:28px} body{padding:12px 10px 50px;font-size:14px}
  table{font-size:13px} .card h2{font-size:15.5px}
}
</style>
</head>

<div class="wrap">

<header>

<!-- 종합 -->
<div class="pane on" id="p-overview">

  </div>
  <div class="card">

    <div class="chart" id="chartAmt"></div>
    <div class="legend">
      <span><i style="background:#dc2626"></i>무매출 재고</span>
      <span><i style="background:#2563eb"></i>미출고 재고 (점선)</span>
    </div>
  </div>
  <div class="card">
    <h2><span class="bar"></span>유형별 현황</h2>
    <div class="tblwrap"><table id="tblType"></table></div>
  </div>
  <div class="card">
    <h2><span class="bar"></span>브랜드 TOP 20 <span class="note">무매출 재고액 큰 순</span></h2>
    <div class="tblwrap"><table id="tblBrand"></table></div>
  </div>
</div>

<!-- 지점별 -->
<div class="pane" id="p-branch">
  <div class="card">
    <h2><span class="bar"></span>지점 × 유형별 현황 <span class="note">지난 회차 대비 증감</span></h2>
    <div class="filters">
      <input id="fBranch" placeholder="지점명 검색…">
      <select id="fBType"><option value="">전체 유형</option></select>
    </div>
    <div class="tblwrap"><table id="tblBranch"></table></div>
  </div>
</div>

<!-- 무매출 상품 -->
<div class="pane" id="p-nosales">
  <div class="card">
    <h2><span class="bar"></span>무매출 스타일 <span class="note">재고액 상위</span></h2>
    <div class="filters">
      <input id="fNS" placeholder="스타일코드 · 상품명 · 브랜드 검색…">
      <select id="fNSBrand"><option value="">전체 브랜드</option></select>
    </div>
    <div class="tblwrap"><table id="tblNS"></table></div>
  </div>
</div>

<!-- 미출고 상품 -->
<div class="pane" id="p-undeliv">
  <div class="card">
    <h2><span class="bar"></span>미출고 스타일 <span class="note">재고액 상위</span></h2>
    <div class="filters">
      <input id="fUD" placeholder="스타일코드 · 상품명 · 브랜드 검색…">
      <select id="fUDBrand"><option value="">전체 브랜드</option></select>
    </div>
    <div class="tblwrap"><table id="tblUD"></table></div>
  </div>
</div>

<!-- 지점×상품 -->
<div class="pane" id="p-detail">
  <div class="card">
    <h2><span class="bar"></span>지점별 무매출 상세 <span class="note">재고액 상위</span></h2>
    <div class="filters">
      <input id="fDT" placeholder="지점 · 스타일 · 브랜드 검색…">
      <select id="fDTType"><option value="">전체 유형</option></select>
    </div>
    <div class="tblwrap"><table id="tblDT"></table></div>
  </div>
</div>

<footer>무매출/미출고 자동 분석 시스템 · run.bat 실행 시 자동 갱신</footer>
</div>

  const a = Math.abs(v), sg = v<0 ? '-' : '';
  if (a >= 1e8) return sg+(a/1e8).toFixed(1)+'억';
  if (a >= 1e6) return sg+(a/1e6).toFixed(0)+'백만';
  if (a >= 1e4) return sg+(a/1e4).toFixed(0)+'만';
  return n(v);
};
const pct = v => ((v||0)*100).toFixed(1)+'%';
const dcls = v => v>0 ? 'up' : (v<0 ? 'down':'flat');
const darrow = v => v>0 ? '▲'+n(Math.abs(v)) : (v<0 ? '▼'+n(Math.abs(v)) : '—');
const btag = t => {
  const c = t==='직영점'?'b-fix' : (t==='픽스키즈'?'b-kids':'b-etc');
  return `<span class="badge ${c}">${t}</span>`;
};
const esc = s => String(s==null?'':s).replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

/* ---------- KPI ---------- */
function renderKpi(){
  const k = DATA.kpi;
  document.getElementById('runDate').textContent = k.run_date;
  document.getElementById('prevDate').textContent = k.prev_date || '없음';

  const cards = [
    {k:'k-total', lb:'26년 전체 스타일', v:n(k.total_styles), cls:'', s:'', d:null},
    {k:'k-nosales', lb:'무매출', v:n(k.no_sales), cls:'c-pink',
     s:`재고 ${won(k.no_sales_amt)}원 · ${n(k.no_sales_qty)}개`, d:k.d_no_sales},
    {k:'k-undeliv', lb:'미출고', v:n(k.undelivered), cls:'c-yellow',
     s:`재고 ${won(k.undelivered_amt)}원 · ${n(k.undelivered_qty)}개`, d:k.d_undelivered},
    {k:'k-branch', lb:'지점×스타일 무매출', v:n(k.branch_no_sales), cls:'c-purple',
     s:'매장에 깔린 채 안 팔림', d:k.d_branch},
  ];
  document.getElementById('kpis').innerHTML = cards.map(c=>`
    <div class="kpi ${c.k}">
      <div class="lb">${c.lb}</div>
      <div class="v ${c.cls}">${c.v}</div>
      ${c.s?`<div class="s">${c.s}</div>`:''}
      ${c.d!=null?`<div class="d ${dcls(c.d)}">${darrow(c.d)} 건</div>`:''}
    </div>`).join('');
}

/* ---------- 라인 차트 ---------- */
function lineChart(el, series, fmt){
  const box = document.getElementById(el);
  const T = DATA.trend;
  if (!T.length){ box.innerHTML = '<div class="empty">데이터 없음</div>'; return; }

  const W=760, H=260, pad={t:18,r:18,b:38,l:64};
  const iw = W-pad.l-pad.r, ih = H-pad.t-pad.b;
  const all = series.flatMap(s => T.map(d => s.get(d)));
  const max = Math.max(...all, 1) * 1.12;
  const x = i => pad.l + (T.length<=1 ? iw/2 : i*iw/(T.length-1));
  const y = v => pad.t + ih - (v/max)*ih;

  let g = '';
  // 그리드
  for (let i=0;i<=4;i++){
    const gy = pad.t + ih*i/4;
    g += `<line x1="${pad.l}" y1="${gy}" x2="${W-pad.r}" y2="${gy}"
           stroke="#d5dae1" stroke-width="1" stroke-dasharray="3,4"/>`;
    g += `<text x="${pad.l-8}" y="${gy+4}" fill="#5b6572" font-size="12.5"
           text-anchor="end">${fmt(max*(4-i)/4)}</text>`;
  }
  // 라인 + 점
  series.forEach(s=>{
    const pts = T.map((d,i)=>`${x(i)},${y(s.get(d))}`).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}"
           stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"
           ${s.dash?`stroke-dasharray="${s.dash}"`:''}/>`;
    T.forEach((d,i)=>{
      g += `<circle cx="${x(i)}" cy="${y(s.get(d))}" r="5" fill="#fff"
             stroke="${s.color}" stroke-width="3"/>`;
      g += `<title>${d.date} · ${s.name} ${fmt(s.get(d))}</title>`;
    });
  });
  // x축
  T.forEach((d,i)=>{
    if (T.length>7 && i%2===1 && i!==T.length-1) return;
    g += `<text x="${x(i)}" y="${H-10}" fill="#5b6572" font-size="12"
           text-anchor="middle">${d.date.slice(5)}</text>`;
  });

  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>`;
}

/* ---------- 표 ---------- */
function table(el, cols, rows, emptyMsg){
  const t = document.getElementById(el);
  if (!rows.length){ t.innerHTML = `<tr><td class="empty" colspan="${cols.length}">${emptyMsg||'데이터 없음'}</td></tr>`; return; }
  const head = '<thead><tr>' + cols.map(c=>`<th class="${c.l?'l':''}">${c.h}</th>`).join('') + '</tr></thead>';
  const body = '<tbody>' + rows.map(r=>'<tr>' +
      cols.map(c=>`<td class="${c.l?'l':''} ${c.cls?c.cls(r):''}">${c.f(r)}</td>`).join('') +
    '</tr>').join('') + '</tbody>';
  t.innerHTML = head + body;
}

/* ---------- 렌더 ---------- */

  lineChart('chartCnt', [

  ], v=>n(Math.round(v)));

  lineChart('chartAmt', [
    {name:'무매출', color:'#dc2626', get:d=>d.no_sales_amt/1e6},
    {name:'미출고', color:'#2563eb', get:d=>d.undelivered_amt/1e6, dash:'6,4'},
  ], v=>n(Math.round(v)));

  // 유형별
  const maxT = Math.max(...DATA.type_summary.map(t=>t.cnt), 1);
  table('tblType', [
    {h:'유형', l:1, f:r=>btag(r.btype)},
    {h:'지점 수', f:r=>n(r.stores)},
    {h:'무매출 건수', f:r=>`<span class="mb" style="width:${Math.round(r.cnt/maxT*46)}px"></span>${n(r.cnt)}`},
    {h:'전 회차', f:r=>n(r.prev_cnt)},
    {h:'증감', f:r=>darrow(r.d_cnt), cls:r=>dcls(r.d_cnt)},
    {h:'증감율', f:r=>pct(r.rate), cls:r=>dcls(r.d_cnt)},
    {h:'재고원가', f:r=>won(r.amt)+'원'},
    {h:'재고 증감', f:r=>(r.d_amt>0?'+':'')+won(r.d_amt), cls:r=>dcls(r.d_amt)},
  ], DATA.type_summary);

  // 브랜드
  const maxB = Math.max(...DATA.brands.map(b=>b.amt), 1);
  table('tblBrand', [
    {h:'브랜드', l:1, f:r=>esc(r.name)},
    {h:'스타일 수', f:r=>n(r.cnt)},
    {h:'재고수량', f:r=>n(r.qty)},
    {h:'재고원가', f:r=>`<span class="mb" style="width:${Math.round(r.amt/maxB*46)}px"></span>${won(r.amt)}원`},
  ], DATA.brands);

  renderBranch(); renderNS(); renderUD(); renderDT();
}

    {h:'지점', l:1, f:r=>esc(r.name)},
    {h:'유형', l:1, f:r=>btag(r.btype)},
    {h:'무매출 건수', f:r=>`<span class="mb" style="width:${Math.round(r.cnt/maxC*46)}px"></span>${n(r.cnt)}`},
    {h:'전 회차', f:r=>n(r.prev_cnt)},

}

/* ---------- 초기화 ---------- */
function fillSelect(id, values){
  const el = document.getElementById(id);
  [...new Set(values)].filter(Boolean).sort().forEach(v=>{
    const o=document.createElement('option'); o.value=v; o.textContent=v; el.appendChild(o);
  });
}

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    document.getElementById('p-'+t.dataset.p).classList.add('on');
  };
});

fillSelect('fBType', DATA.branches.map(b=>b.btype));
fillSelect('fDTType', DATA.branch_styles.map(b=>b.btype));
fillSelect('fNSBrand', DATA.no_sales_styles.map(s=>s.brand));
fillSelect('fUDBrand', DATA.undelivered_styles.map(s=>s.brand));

});
